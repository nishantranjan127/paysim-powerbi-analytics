[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-lakehouse"
version = "0.1.0"
description = "Financial transactions portfolio lakehouse for Azure Databricks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.50,<2"]
paysim = ["duckdb>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["finance_lakehouse*"]
